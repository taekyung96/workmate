# =============================================================
# Prometheus 스크레이프 설정 (F-OBS)
#
# WAS·WEB 의 관리 포트(9081·9080)는 호스트에 공개하지 않는다.
# Prometheus 가 같은 도커 네트워크 안에서 서비스명으로 접근하므로
# 외부에 아무 포트도 열지 않고 수집이 된다.
#
# 주의: 컨테이너로 띄운 앱만 관찰한다. bootRun(Windows 호스트)은 대상이 아니다
#       — 이유는 .notes/PLAN-observability-5.md §3-1 참고.
# =============================================================
global:
    scrape_interval: 15s
    evaluation_interval: 15s

scrape_configs:
    - job_name: workmate-was
      metrics_path: /actuator/prometheus
      static_configs:
          - targets: ["was:9081"]
            labels:
                application: workmate-was

    - job_name: workmate-web
      metrics_path: /actuator/prometheus
      static_configs:
          - targets: ["web:9080"]
            labels:
                application: workmate-web

    # Prometheus 자기 자신 — 수집이 멈췄는지 판단하는 기준선
    - job_name: prometheus
      static_configs:
          - targets: ["localhost:9090"]
