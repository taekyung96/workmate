# =============================================================
# 대시보드 자동 로드 설정 (F-OBS)
#
# 이 디렉토리의 *.json 을 기동 시 읽어 들인다.
# 대시보드 JSON 은 손으로 쓰지 않는다 — Grafana UI 에서 만든 뒤 Export 해서
# 이 디렉토리에 넣는다(손으로 쓰면 조용히 깨지고 검증이 어렵다).
# =============================================================
apiVersion: 1

providers:
    - name: workmate
      type: file
      allowUiUpdates: true
      options:
          path: /etc/grafana/provisioning/dashboards
          foldersFromFilesStructure: false
