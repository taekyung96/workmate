# =============================================================
# 개발용 compose — 소스에서 직접 빌드한다. 배포용은 docker-compose.deploy.yml
#
#   docker compose up -d
#
# 프로젝트명을 고정한다. 없으면 도커가 "디렉토리 이름"을 프로젝트명으로 쓰는데,
# 저장소를 workmate 로 클론한 서버에서는 그 값이 배포 compose 의 name: workmate 와
# 같아진다. 그러면 -f 를 빠뜨린 `docker compose up -d` 한 번에 개발 스택이
# 운영 DB 볼륨에 그대로 붙는다(AES 키도 이미지도 다른 채로). 그걸 막는다.
# =============================================================
name: workmate-dev

services:
    db:
        image: pgvector/pgvector:pg17
        container_name: workmate-db
        ports:
            - "5432:5432"
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            # 관측 스택(--profile obs)의 Grafana 읽기 전용 롤 비밀번호 — db/init/19-grafana-readonly.sh 가 읽는다.
            # 값이 없으면 그 스크립트가 롤 생성을 건너뛴다(관측 스택을 안 쓰면 정상)
            GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-}
        volumes:
            - workmate-db-data:/var/lib/postgresql/data
            # 스키마·시드는 더 이상 여기서 만들지 않는다 — WAS 기동 시 Flyway(db/migration)가 적용한다.
            # 이 디렉토리에는 initdb 단계에서만 돌아야 하는 19-grafana-readonly.sh(롤 생성) 하나만 남아 있다.
            # 데모 계정·콘텐츠는 scripts/bootstrap-demo-data.sh 가 WAS 기동 후에 만든다(Flyway 로 테이블이 생긴 뒤라야 한다).
            # 과거 스키마 SQL 은 db/init/legacy/ 에 대조용으로 보관 중이며 마운트되지 않는다.
            - ./db/init:/docker-entrypoint-initdb.d
        # initdb 스크립트(롤 생성 등)가 끝나야 healthy → was 가 준비된 DB 에만 붙는다
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
                ]
            interval: 5s
            timeout: 5s
            retries: 10

    # ---------------------------------------------------------------
    # Redis — 분산 상태 저장소 (세션 · SessionRegistry · 레이트리밋)
    #
    # WEB 과 WAS 가 같은 인스턴스를 공유하되 키 네임스페이스로 나눈다:
    #   workmate:session:*    (WEB, Spring Session 이 관리)
    #   workmate:ratelimit:*  (WAS, ChatRateLimiter)
    #
    # appendonly 를 켜는 이유: 세션이 여기 있으므로 재시작에 전부 날아가면
    # 로그인한 사용자가 전부 튕긴다. RDB 스냅샷만으로는 마지막 저장 이후가 사라진다.
    # ---------------------------------------------------------------
    redis:
        image: redis:7-alpine
        container_name: workmate-redis-dev
        command: redis-server --appendonly yes
        ports:
            - "6379:6379"
        volumes:
            - workmate-redis-data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 3s
            retries: 5

    # ↓ was/web 은 'full' 프로파일에서만 뜬다 (기본 up 은 db 만 → 로컬 IDE 개발 흐름 보존)
    #   개발 중 DB 만:  docker compose up -d db
    #   전체 원클릭:    docker compose --profile full up --build
    was:
        profiles: ["full"]
        build:
            context: .
            dockerfile: workmate-was/Dockerfile
        container_name: workmate-was
        ports:
            - "8081:8081"
        environment:
            SPRING_PROFILES_ACTIVE: docker
            DB_HOST: db
            # 컨테이너 안에서 localhost 는 자기 자신이다 — 서비스명으로 붙어야 한다.
            # 빠지면 레이트리미터가 fail-open 이라 조용히 무력화된다(에러가 안 난다)
            REDIS_HOST: redis
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            GEMINI_API_KEY: ${GEMINI_API_KEY}
            # 개인정보 AES 암복호화 키 — 이미지에 .env 를 넣지 않으므로 여기서 주입한다
            # (없으면 AesCryptoConverter 생성 실패로 컨텍스트 로딩이 깨진다)
            AES_SECRET_KEY: ${AES_SECRET_KEY}
            AES_SECRET_IV: ${AES_SECRET_IV}
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy

    web:
        profiles: ["full"]
        build:
            context: .
            dockerfile: workmate-web/Dockerfile
        container_name: workmate-web
        ports:
            - "8080:8080"
        environment:
            SPRING_PROFILES_ACTIVE: docker
            WAS_BASE_URL: http://was:8081
            # 세션 저장소. 빠지면 localhost:6379 로 붙으려다 기동 자체가 실패한다
            REDIS_HOST: redis
            # 소셜 로그인(F1-1) 자격증명 — 미주입 시 not-configured 로 떨어져 버튼이 동작하지 않는다.
            # 배포 도메인에서 쓰려면 각 제공자 콘솔에 콜백 URL 도 등록해야 한다.
            NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-not-configured}
            NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-not-configured}
            KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-not-configured}
            KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-not-configured}
            GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-not-configured}
            GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-not-configured}
        depends_on:
            was:
                condition: service_started
            redis:
                condition: service_healthy

    # ↓ 관측 스택(F-OBS 슬라이스 5) — 'obs' 프로파일에서만 뜬다. 평소 up -d 에는 안 나온다.
    #   개발 중 앱까지 관찰:  docker compose --profile full --profile obs up -d
    prometheus:
        profiles: ["obs"]
        image: prom/prometheus:v2.55.1
        container_name: workmate-prometheus
        volumes:
            - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
            - workmate-prometheus-data:/prometheus
        command:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.retention.time=15d"
        # 호스트에 포트를 공개하지 않는다 — 같은 도커 네트워크의 Grafana 만 접근 (§3-3)

    grafana:
        profiles: ["obs"]
        image: grafana/grafana:11.4.0
        container_name: workmate-grafana
        ports:
            - "3000:3000" # 개발 로컬 전용 — 배포는 127.0.0.1 루프백만(docker-compose.deploy.yml)
        environment:
            GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
            # datasources.yml 의 ${POSTGRES_DB}·${GRAFANA_DB_PASSWORD} 치환용 — 없으면 DB 데이터소스가 조용히 깨진다
            POSTGRES_DB: ${POSTGRES_DB}
            GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
        volumes:
            - ./docker/grafana/provisioning:/etc/grafana/provisioning
            - workmate-grafana-data:/var/lib/grafana
        depends_on:
            - prometheus
            - db

volumes:
    workmate-db-data:
    workmate-redis-data:
    workmate-prometheus-data:
    workmate-grafana-data:
