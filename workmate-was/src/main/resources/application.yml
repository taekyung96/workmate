# 공통 설정 — 환경별 값(포트, DB 접속 정보)은 application-{local,dev,prod}.yml 에 둔다
spring:
    application:
        name: workmate-was
    profiles:
        active: local # 기본은 로컬 개발, 배포 시 -Dspring.profiles.active 로 전환
    servlet:
        multipart:
            max-file-size: 25MB # 업로드 허용 크기 — 영수증 이미지 + 회의 오디오(F8-1) 수용 (기본 1MB로는 부족)
            max-request-size: 30MB
    data:
        redis:
            host: ${REDIS_HOST:localhost}
            port: ${REDIS_PORT:6379}
            # 연결이 안 될 때 무한 대기하지 않는다 — 레이트리밋 때문에 채팅 전체가 멈추면 안 된다
            timeout: 2s
            connect-timeout: 2s
    jpa:
        hibernate:
            ddl-auto: validate # 스키마는 Flyway 마이그레이션(db/migration)으로만 관리 (AI 임의 변경 방지)
        open-in-view: false
    # DB 스키마 마이그레이션 — WAS 기동 시 db/migration 의 미적용분을 순서대로 적용하고
    # flyway_schema_history 에 이력을 남긴다. 새 컨테이너·CI·이미 떠 있는 서버가 같은 경로를 탄다.
    flyway:
        enabled: true
        locations: classpath:db/migration
        # V2 시드 데이터(가이드 문서)에 GitHub Actions 예시로 ${{ secrets.X }} 같은 리터럴 문자열이
        # 그대로 들어 있다. Flyway 의 플레이스홀더 치환 기능이 이걸 ${...} 플레이스홀더로 오인해
        # 파싱 에러(FlywayException)를 낸다 — 플레이스홀더 기능 자체를 안 쓰므로 끈다.
        placeholder-replacement: false
        # 이미 db/init/*.sql 로 스키마·시드가 들어가 있는 기존 DB 를 "V1 은 이미 적용됨" 으로
        # 도장 찍고 V2 부터 진행시킨다. V2 는 전부 ON CONFLICT DO NOTHING 이라 baseline-version=1 로
        # 두어도 중복 INSERT 로 실패하지 않는다(재실행 가능하게 설계).
        baseline-on-migrate: true
        baseline-version: 1
    ai:
        # 어느 제공자의 자동설정을 켤지 고른다. 스타터가 둘(google-genai·openai) 다 클래스패스에 있어
        # 명시하지 않으면 ChatModel 빈이 둘이 되어 충돌한다.
        #   chat      — LLM_CHAT_PROVIDER 로 전환 (openai=Groq | google-genai=Gemini)
        #   embedding — 항상 Gemini. 임베딩 모델을 바꾸면 출력 차원이 달라져
        #               vector_store(768) 를 통째로 재생성하고 전 문서를 재임베딩해야 한다
        model:
            chat: ${LLM_CHAT_PROVIDER:google-genai}
            embedding: google-genai
        # LLM 호출 재시도 — 기본값(10회 · 2s→10s→50s 백오프)은 무료 티어에 맞지 않는다.
        # 429(분당 한도)는 Google 이 0.5초 만에 즉시 돌려주는데, 기본 설정으로 재시도하면
        # 사용자는 70초를 기다린 끝에 응답을 받는다 — 그동안 화면은 먹통으로 보인다.
        # 차라리 몇 초 안에 실패시켜 "요청이 많습니다" 안내를 띄우는 편이 낫다
        # (429 안내 UI 는 ChatServiceImpl.isQuotaError 경로에 이미 있다).
        # 일시적 네트워크 오류를 흡수할 만큼만 남긴다.
        retry:
            max-attempts: 2
            backoff:
                initial-interval: 1s
                multiplier: 2
                max-interval: 5s
        # Groq — OpenAI 호환 엔드포인트라 openai 스타터를 그대로 쓰고 base-url 만 돌린다.
        # spring.ai.model.chat=openai 일 때만 활성화된다(위 model 블록 참고).
        # 무료 티어 기준 분당 요청 한도가 Gemini 보다 넉넉하고 LPU 로 추론이 빠르다.
        openai:
            api-key: ${GROQ_API_KEY:not-configured}
            base-url: https://api.groq.com/openai
            chat:
                options:
                    # 기본 모델. 허용 목록(화이트리스트)은 AI_MODEL 공통코드가 관리한다 —
                    # 여기 값은 '사용자가 모델을 안 고를 때 무엇을 쓰나' 뿐이다.
                    model: ${LLM_CHAT_MODEL:llama-3.3-70b-versatile}
                    temperature: 0.7
        google:
            genai:
                api-key: ${GEMINI_API_KEY} # .env → 환경변수 주입 (README 참고)
                chat:
                    options:
                        # gemini-2.5-flash 는 신규 사용자에게 404(폐기) → 항상 최신 flash 를 가리키는 별칭 사용
                        # (chat·OCR·voice 가 공유하는 기본 모델. 특정 버전 고정이 필요하면 gemini-3.5-flash 등으로 교체)
                        model: ${LLM_CHAT_MODEL:gemini-flash-latest}
                # 임베딩은 채팅과 자동설정이 분리되어 있어 api-key 를 별도로 요구한다
                # (경로 주의: embedding.options.model 이 아니라 embedding.text.options.model)
                # text-embedding-004 는 현재 genai v1beta embedContent 에서 404 → 사용 가능한
                # gemini-embedding-001 로 전환하고, vector_store(768) 에 맞춰 출력 차원을 768 로 고정.
                embedding:
                    api-key: ${GEMINI_API_KEY}
                    text:
                        options:
                            model: gemini-embedding-001
                            dimensions: 768
        vectorstore:
            pgvector:
                initialize-schema: false # 스키마는 Flyway(db/migration/V1__baseline_schema.sql)로 관리
                index-type: HNSW
                dimensions: 768 # 임베딩 출력 차원(gemini-embedding-001 을 768 로 고정)

# MyBatis — XML 매퍼 위치. 지금까지는 등록된 Mapper 가 0개라 생략돼 있었다(MyBatisConfig 주석 참고).
# 관리자 사용량 대시보드(usage/dao/LlmUsageQueryMapper)가 첫 XML 매퍼라 명시적으로 켠다.
mybatis:
    mapper-locations: classpath:mapper/**/*.xml

# 개인정보(이메일·전화번호) AES-256 암호화 키 — .env 환경변수 주입
# 고정 IV 를 쓰는 결정적 암호화: 같은 평문 → 같은 암호문 (email UK·검색을 위해 필요, v1 방식 이식)
app:
    crypto:
        aes-key: ${AES_SECRET_KEY}
        aes-iv: ${AES_SECRET_IV}
    # 업로드 파일 보관 위치 — 회의 오디오(F8-1)·영수증 이미지. 루트는 이 설정값을 쓴다
    # (상대경로는 WAS 실행 디렉토리 기준. 배포 시 절대경로로 덮어쓴다)
    upload:
        voice-dir: uploads/voice
        receipt-dir: uploads/receipt
    # 로그인 잠금 정책(F1-06) — 연속 실패 max-fail-count 회 도달 시 lock-minutes 분간 잠금
    auth:
        max-fail-count: 5
        lock-minutes: 60
    # 채팅(F2) 설정 — 프롬프트에 포함할 직전 대화 개수(F2-10)·분당 요청 제한(F2-11)
    #                + RAG 유사도 상위 K개·최소 임계값(F4-06)
    chat:
        context-size: 10
        rate-limit-per-minute: 20
        # 레이트리밋 카운터 저장소 — redis(기본) | memory
        # memory 는 단일 인스턴스 전용이다. 인스턴스가 2개 이상이면 한도가 곱해진다
        rate-limit-store: ${RATE_LIMIT_STORE:redis}
        rag-top-k: 4
        rag-threshold: 0.4
    # 관리자 사용량 대시보드(PLAN-usage-dashboard.md §4) — 추정 비용 환산.
    # 단가를 common_code(관리자가 화면에서 수정)에 두는 안은 기각했다 — 오타 하나로 비용 통계
    # 전체가 조용히 틀어질 수 있어서다. 설정 파일은 git 이력으로 "언제 누가 바꿨는지" 남는다.
    # 여기 없는 model_name 은 0원이 아니라 "단가 미등록"으로 분리 집계된다(UsagePricingCalculator).
    # 화면에는 반드시 "추정" 표기 — 실제 청구액이 아니다.
    usage:
        # 100만 토큰당 단가(USD). 출처: https://ai.google.dev/gemini-api/docs/pricing (확인일자: 2026-08-31)
        # 주의: 'gemini-flash-latest' 는 별칭(alias)이라 llm_usage.model_name 에는 그 이름이 아니라
        # 제공자가 해석한 실제 모델명(예: gemini-3.7-flash)이 저장된다. 단가는 해석된 이름 기준으로
        # 등록해야 매칭된다. 별칭이 새 버전을 가리키면 여기에 항목을 추가한다 —
        # 그전까지는 화면의 '단가 미등록 N건' 으로 드러나므로 조용히 0원으로 계산되지 않는다.
        # 키를 대괄호로 감싸는 이유: 모델명에 점이 들어가면(gemini-3.7-flash) Spring 이 이를
        # 중첩 경로로 해석해 'gemini-3' 아래 '7-flash' 로 쪼갠다. [ ] 표기라야 키 원문 그대로 바인딩된다.
        pricing:
            "[gemini-3.7-flash]": { input: 0.30, output: 2.50 }
            "[gemini-flash-latest]": { input: 0.30, output: 2.50 }
            "[gemini-embedding-001]": { input: 0.15, output: 0.00 }
            # Groq 무료 티어는 토큰당 과금이 없다(크레딧 개념도 없고 요청 한도로만 제한).
            # 0 으로 등록하는 이유: 비워 두면 "단가 미등록 N건"으로 집계에서 빠져
            # 실제로는 공짜인 호출이 "비용을 모르는 호출"처럼 보인다.
            # 유료 전환 시 https://groq.com/pricing 확인 후 실제 단가로 바꿀 것.
            "[openai/gpt-oss-120b]": { input: 0.00, output: 0.00 }
            "[qwen/qwen3.8-27b]": { input: 0.00, output: 0.00 }
        currency-rate: 1400 # USD→KRW 고정 환산율(추정치)

# 요청 추적 ID(F-OBS) 를 모든 로그 줄에 찍는다. 값이 없으면 빈 문자열(-)
# 구조화 로깅(JSON)이 켜지는 docker 프로파일에서는 MDC 값이 JSON 필드로 자동 포함되므로 이 패턴은 의미가 없다 —
# local 프로파일(사람이 읽는 텍스트 로그)에서만 쓰인다.
logging:
    pattern:
        level: "%5p [%X{requestId:-}]"

# 관측(Observability) — 지표는 관리 포트로만 낸다.
# 앱 포트(8081)와 분리해 두면 compose 에서 관리 포트를 공개하지 않는 것만으로 외부 차단이 된다.
# Prometheus 는 같은 도커 네트워크에서 was:9081 로 붙는다.
management:
    server:
        port: 9081
    endpoints:
        web:
            exposure:
                include: health,info,prometheus
    endpoint:
        health:
            show-details: never # 외부에 DB 접속 상태 등 내부 정보를 흘리지 않는다
    metrics:
        tags:
            application: workmate-was
