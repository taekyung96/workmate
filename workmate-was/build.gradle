plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.0'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.workmate'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '17'

// Spring Boot 3.2+ 에서 @RequestParam 등의 파라미터명을 리플렉션으로 감지하려면 필수
tasks.withType(JavaCompile) {
    options.compilerArgs += ['-parameters']
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }
}

dependencies {
    // .env 파일을 자동으로 읽어 환경변수처럼 주입 — gradlew bootRun/IDE(STS 등) 실행 방식과 무관하게 동작
    // 실제 OS 환경변수(운영 서버 등)가 있으면 그게 우선되고 .env는 로컬 폴백으로만 쓰인다
    implementation 'me.paulschwarz:spring-dotenv:4.0.0'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // 관측(F-OBS) — /actuator/prometheus 로 지표 노출. 관리 포트는 앱 포트와 분리해 외부에 열지 않는다.
    // Spring AI 는 Micrometer 가 있으면 gen_ai.* (토큰 사용량 등)를 자동 계측한다
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // DB 스키마 마이그레이션 — 버전 명시 금지(Spring Boot 3.5.0 BOM 이 관리)
    // PostgreSQL 17 은 flyway-core 만으로 부족하고 flyway-database-postgresql 모듈이 별도로 필요하다
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'com.github.gavlyukovskiy:p6spy-spring-boot-starter:1.9.2'
    implementation platform("org.springframework.ai:spring-ai-bom:1.1.8")
    implementation 'org.springframework.ai:spring-ai-starter-model-google-genai'
    // Groq 은 OpenAI 호환 엔드포인트라 전용 스타터가 없다 — OpenAI 클라이언트를 재사용하고
    // base-url 만 Groq 으로 돌린다 (Spring AI 공식 문서의 Groq 연동 방식).
    // 어느 자동설정을 켤지는 spring.ai.model.chat / spring.ai.model.embedding 으로 고른다.
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'
    // 임베딩 모델은 채팅 스타터에 포함되지 않는 별도 모듈 (없으면 EmbeddingModel 빈 미생성 → pgvector 기동 실패)
    implementation 'org.springframework.ai:spring-ai-starter-model-google-genai-embedding'
    implementation 'org.springframework.ai:spring-ai-starter-vector-store-pgvector'
    runtimeOnly 'org.postgresql:postgresql'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    // BCrypt 만 필요 — 전체 Security 스타터는 WEB 레이어 담당이므로 crypto 모듈만
    implementation 'org.springframework.security:spring-security-crypto'
    // 무거운 조회(다중 조인·동적 검색·페이징)용 — 단순 CRUD는 계속 JPA 사용 (가이드 §2)
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.3'
    // 분산 레이트리밋 — 인스턴스가 여러 개일 때 카운터를 공유해야 한도가 지켜진다.
    // Lettuce(기본 클라이언트)는 커넥션을 스레드 간 공유하므로 별도 풀 설정이 필요 없다
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // 도우미 SSE Flux 검증용 (StepVerifier)
    testImplementation 'io.projectreactor:reactor-test'
}

tasks.named('test') {
    useJUnitPlatform {
        // 평가·시딩·유지보수 하네스는 비용·API키·실행 중인 DB 가 필요하므로 평상시 test 에서 제외
        excludeTags 'rag-eval', 'seed-guides', 'maintenance'
    }
    // CryptoProperties(app.crypto.*) 바인딩에 필요한 AES 키를 테스트 JVM 에 주입한다.
    // 운영/로컬은 .env 로 AES_SECRET_KEY/AES_SECRET_IV 를 주입하지만 테스트에는 환경변수가 없어
    // @SpringBootTest 컨텍스트 로딩이 실패하므로, 실제 키와 무관한 더미를 여기서만 넣는다.
    // (테스트 전용 더미 — 실제 키 아님. 암복호화 동작 자체는 AesCipherTest 가 별도로 검증한다)
    environment 'AES_SECRET_KEY', 'MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY='
    environment 'AES_SECRET_IV', 'MDEyMzQ1Njc4OWFiY2RlZg=='
}

// AES 더미(컨텍스트 로딩용) — 평가·시딩 태스크가 공유한다.
def evalEnv = { Test t ->
    t.environment 'AES_SECRET_KEY', 'MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY='
    t.environment 'AES_SECRET_IV', 'MDEyMzQ1Njc4OWFiY2RlZg=='
    // 실제 GEMINI_API_KEY·DB 접속정보는 .env(spring-dotenv) 또는 OS 환경변수에서 주입된다
    t.testLogging { showStandardStreams = true }
    t.outputs.upToDateWhen { false }  // 상태 의존이라 항상 재실행
}

// 면접 가이드 코퍼스를 dev DB 에 등록(+임베딩)한다. GEMINI_API_KEY + dev DB 필요.
tasks.register('seedGuides', Test) {
    group = 'verification'
    description = '면접 가이드 코퍼스 시딩(@Tag seed-guides)'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'seed-guides' }
    evalEnv(it)
}

// guide 와 vector_store 사이의 임베딩 누락분을 채운다(유지보수). GEMINI_API_KEY + dev DB 필요.
tasks.register('syncEmbeddings', Test) {
    group = 'verification'
    description = '누락된 가이드 임베딩 동기화(@Tag maintenance)'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'maintenance' }
    evalEnv(it)
}

// RAG 검색 품질 평가 — 실제 dev DB + 실제 임베딩으로 수동 실행. GEMINI_API_KEY + dev DB 필요.
tasks.register('ragEval', Test) {
    group = 'verification'
    description = 'RAG 검색 품질 평가(@Tag rag-eval) 실행 후 리포트 생성'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'rag-eval' }
    evalEnv(it)
    // 리포트 저장 위치를 저장소 루트 기준 절대경로로 넘긴다(작업 디렉토리 의존 제거)
    systemProperty 'ragEval.reportDir', "${rootProject.projectDir}/docs/features/rag-eval"
}
