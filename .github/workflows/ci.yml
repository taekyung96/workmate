name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    frontend:
        name: Vue SPA (type-check · test · build)
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: workmate-vue
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: workmate-vue/package-lock.json

            - run: npm ci
            - run: npm run type-check
            - run: npm run test:unit
            - run: npm run build-only

    backend:
        name: Spring (WAS · WEB)
        runs-on: ubuntu-latest

        # WAS 통합 테스트는 실제 PostgreSQL(pgvector) 에 붙는다. 스키마는 db/init/*.sql 로만 관리하므로
        # 서비스 컨테이너를 띄운 뒤 아래 단계에서 스크립트를 순서대로 적용한다.
        services:
            postgres:
                image: pgvector/pgvector:pg17
                env:
                    POSTGRES_DB: workmate_db
                    POSTGRES_USER: workmate
                    POSTGRES_PASSWORD: ci-password
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U workmate -d workmate_db"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 10

        env:
            # application-local.yml 은 git 미추적이라 CI 에는 없다 → 환경변수로 주입한다
            SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/workmate_db
            SPRING_DATASOURCE_USERNAME: workmate
            SPRING_DATASOURCE_PASSWORD: ci-password
            # 임베딩이 필요한 테스트는 모델을 스텁으로 갈아끼우므로 실제 호출이 없다.
            # (실제 API 를 부르는 유지보수 유틸리티는 @Tag("maintenance") 로 기본 test 에서 제외)
            # 이 키는 자동설정의 플레이스홀더 해석용 더미다.
            GEMINI_API_KEY: dummy-key-for-ci

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 17

            - uses: gradle/actions/setup-gradle@v4

            # :workmate-web:processResources 가 SPA(npm run build)를 먼저 빌드한다
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: workmate-vue/package-lock.json

            - name: SPA 의존성 설치
              run: npm ci
              working-directory: workmate-vue

            - name: 스키마 적용 (db/init/*.sql)
              run: |
                  for f in $(ls db/init/*.sql | sort); do
                      echo "apply $f"
                      PGPASSWORD=ci-password psql -v ON_ERROR_STOP=1 -q \
                          -h localhost -U workmate -d workmate_db -f "$f"
                  done

            - name: 테스트
              run: |
                  chmod +x gradlew
                  ./gradlew :workmate-was:test :workmate-web:test --no-daemon

            - name: 테스트 리포트 업로드
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: test-reports
                  path: |
                      workmate-was/build/reports/tests/test
                      workmate-web/build/reports/tests/test
                  retention-days: 7

    publish:
        name: 이미지 빌드·푸시 (GHCR)
        # 테스트가 통과한 커밋만 이미지로 만든다. PR 에서는 돌리지 않는다
        # (포크 PR 은 패키지 쓰기 권한이 없고, 검증은 위 두 잡으로 충분하다)
        needs: [frontend, backend]
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest

        permissions:
            contents: read
            packages: write

        # was·web 두 이미지를 병렬로 만든다. 빌드 컨텍스트는 둘 다 저장소 루트다
        # (모노레포 settings.gradle 이 web/was 를 함께 include 하므로)
        strategy:
            matrix:
                service: [workmate-was, workmate-web]

        steps:
            - uses: actions/checkout@v4

            - uses: docker/setup-buildx-action@v3

            - name: GHCR 로그인
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: 태그·라벨 생성
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}
                  # latest 는 배포용, sha 태그는 특정 커밋으로 롤백할 때 쓴다
                  tags: |
                      type=raw,value=latest
                      type=sha,format=long

            - name: 빌드·푸시
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ${{ matrix.service }}/Dockerfile
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  # Gradle 의존성·npm ci 레이어를 캐시해 재빌드를 줄인다
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
