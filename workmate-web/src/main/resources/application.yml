# 공통 설정 — 환경별 값(포트, WAS 주소)은 application-{local,dev,prod}.yml 에 둔다
spring:
    application:
        name: workmate-web
    profiles:
        active: local # 기본은 로컬 개발, 배포 시 -Dspring.profiles.active 로 전환
    servlet:
        multipart:
            # 프록시 업로드 허용 크기 — 영수증 이미지(10MB)뿐 아니라 WEB 을 거치는 회의 오디오(F8-1, 25MB)도
            # 수용해야 하므로 WAS(25MB/30MB) 와 동일하게 맞춘다. (낮으면 큰 오디오가 WAS 도달 전 WEB 에서 막힘)
            max-file-size: 25MB
            max-request-size: 30MB
    thymeleaf:
        cache: false # prod 프로파일에서 true 로 재정의
    security:
        oauth2:
            client:
                registration:
                    # 네이버 (F1-1) — 비밀값은 .env 에서 주입. redirect-uri 는 비밀값이 아니라 여기 둔다.
                    # 기본값이 빈 문자열이면 Spring 이 "Client id must not be empty" 로 기동을 막는다.
                    # 키 없이 받아본 사람도 이메일(데모) 로그인은 쓸 수 있어야 하므로 더미값을 둔다 —
                    # 이 상태에서 소셜 버튼을 누르면 제공자 쪽에서 실패한다.
                    naver:
                        client-id: ${NAVER_CLIENT_ID:not-configured}
                        client-secret: ${NAVER_CLIENT_SECRET:not-configured}
                        client-name: Naver
                        authorization-grant-type: authorization_code
                        redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
                        scope: name, email
                    # 구글을 붙일 때는 아래 3줄만 추가하면 된다 (Spring 내장 제공자라 provider 블록 불필요).
                    # 빈 client-id 로 등록하면 기동 시점에 예외가 나므로, 키를 발급받은 뒤에 넣는다.
                    #   google:
                    #     client-id: ${GOOGLE_CLIENT_ID}
                    #     client-secret: ${GOOGLE_CLIENT_SECRET}
                    #     scope: profile, email   # openid 를 넣으면 OIDC 흐름으로 갈라져 UserService 가 달라진다
                provider:
                    naver:
                        authorization-uri: https://nid.naver.com/oauth2.0/authorize
                        token-uri: https://nid.naver.com/oauth2.0/token
                        user-info-uri: https://openapi.naver.com/v1/nid/me
                        user-name-attribute: response # 네이버는 프로필을 response 객체로 한 겹 감싸서 준다

app:
    oauth2:
        # 소셜 로그인은 전체 페이지 이동이라 끝난 뒤 SPA 화면으로 돌려보내야 한다.
        # 기본값은 Vite 개발 서버(5173) 기준이며, WEB 이 SPA 를 직접 서빙하는 배포 환경에서는
        # prod/docker 프로파일이 상대경로로 재정의한다.
        success-redirect-uri: ${OAUTH2_SUCCESS_REDIRECT_URI:http://localhost:5173/chat}
        failure-redirect-uri: ${OAUTH2_FAILURE_REDIRECT_URI:http://localhost:5173/login}
