# 공통 설정 — 환경별 값(포트, WAS 주소)은 application-{local,dev,prod}.yml 에 둔다
spring:
    application:
        name: workmate-web
    profiles:
        active: local # 기본은 로컬 개발, 배포 시 -Dspring.profiles.active 로 전환
    servlet:
        multipart:
            # 프록시 업로드 허용 크기 — 영수증 이미지(10MB)뿐 아니라 WEB 을 거치는 회의 오디오(F8-1, 25MB)도
            # 수용해야 하므로 WAS(25MB/30MB) 와 동일하게 맞춘다. (낮으면 큰 오디오가 WAS 도달 전 WEB 에서 막힘)
            max-file-size: 25MB
            max-request-size: 30MB
    thymeleaf:
        cache: false # prod 프로파일에서 true 로 재정의
    security:
        oauth2:
            client:
                registration:
                    # 네이버 (F1-1) — 비밀값은 .env 에서 주입. redirect-uri 는 비밀값이 아니라 여기 둔다.
                    # 기본값이 빈 문자열이면 Spring 이 "Client id must not be empty" 로 기동을 막는다.
                    # 키 없이 받아본 사람도 이메일(데모) 로그인은 쓸 수 있어야 하므로 더미값을 둔다 —
                    # 이 상태에서 소셜 버튼을 누르면 제공자 쪽에서 실패한다.
                    naver:
                        client-id: ${NAVER_CLIENT_ID:not-configured}
                        client-secret: ${NAVER_CLIENT_SECRET:not-configured}
                        client-name: Naver
                        authorization-grant-type: authorization_code
                        redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
                        scope: name, email
                    # 카카오 (F1-1) — 시크릿을 헤더가 아니라 본문에 담아 보내므로 client_secret_post 가 필요하다.
                    # scope 는 카카오 콘솔의 동의항목 설정과 일치해야 한다 (어긋나면 KOE205)
                    kakao:
                        client-id: ${KAKAO_CLIENT_ID:not-configured} # 앱 키 중 REST API 키
                        client-secret: ${KAKAO_CLIENT_SECRET:not-configured}
                        client-name: Kakao
                        authorization-grant-type: authorization_code
                        client-authentication-method: client_secret_post
                        redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
                        scope: profile_nickname, account_email
                    # 구글 (F1-1) — Spring 내장 제공자라 provider 블록이 필요 없다.
                    # openid 를 스코프에 넣으면 OIDC 흐름으로 갈라져 OidcUserService 를 타므로 넣지 않는다.
                    # profile·email 만으로 sub·email·name 을 모두 받는다
                    google:
                        client-id: ${GOOGLE_CLIENT_ID:not-configured}
                        client-secret: ${GOOGLE_CLIENT_SECRET:not-configured}
                        scope: profile, email
                provider:
                    naver:
                        authorization-uri: https://nid.naver.com/oauth2.0/authorize
                        token-uri: https://nid.naver.com/oauth2.0/token
                        user-info-uri: https://openapi.naver.com/v1/nid/me
                        user-name-attribute: response # 네이버는 프로필을 response 객체로 한 겹 감싸서 준다
                    kakao:
                        authorization-uri: https://kauth.kakao.com/oauth/authorize
                        token-uri: https://kauth.kakao.com/oauth/token
                        user-info-uri: https://kapi.kakao.com/v2/user/me
                        user-name-attribute: id # 카카오는 식별자만 최상위에 있고 이메일·닉네임은 중첩돼 있다

app:
    oauth2:
        # 소셜 로그인은 전체 페이지 이동이라 끝난 뒤 SPA 화면으로 돌려보내야 한다.
        # 기본값은 Vite 개발 서버(5173) 기준이며, WEB 이 SPA 를 직접 서빙하는 배포 환경에서는
        # prod/docker 프로파일이 상대경로로 재정의한다.
        success-redirect-uri: ${OAUTH2_SUCCESS_REDIRECT_URI:http://localhost:5173/chat}
        failure-redirect-uri: ${OAUTH2_FAILURE_REDIRECT_URI:http://localhost:5173/login}

# 관측(Observability) — 지표는 관리 포트로만 낸다.
# WEB 은 인터넷에 노출되므로 앱 포트(8080)에 actuator 를 붙이면 안 된다.
# 관리 포트(9080)는 compose 에서 호스트에 공개하지 않는다.
management:
    server:
        port: 9080
    endpoints:
        web:
            exposure:
                include: health,info,prometheus
    endpoint:
        health:
            show-details: never
    metrics:
        tags:
            application: workmate-web
