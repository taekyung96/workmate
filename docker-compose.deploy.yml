# =============================================================
# 배포용 compose — 서버는 GHCR 이미지를 "받기만" 한다.
# 소스 빌드가 없으므로 서버에 JDK·Node·Gradle 이 필요 없다.
#
#   git clone https://github.com/taekyung96/workmate.git   # db/init/19-grafana-readonly.sh 가 필요해서 클론한다
#   cd workmate && cp .env.example .env && vi .env          # 비밀값 채우기
#   docker compose -f docker-compose.deploy.yml up -d
#
# 갱신:  docker compose -f docker-compose.deploy.yml pull && ... up -d
# 롤백:  IMAGE_TAG=sha-<커밋해시> docker compose -f docker-compose.deploy.yml up -d
#
# 개발용은 docker-compose.yml (소스에서 빌드). 양쪽 다 name: 을 못 박아 두었으므로
# (workmate / workmate-dev) 프로젝트가 갈리고 볼륨도 섞이지 않는다.
# =============================================================

# 프로젝트명을 고정한다 — 디렉토리 이름에 따라 컨테이너·볼륨 접두사가 바뀌지 않게
name: workmate

services:
    db:
        image: pgvector/pgvector:pg17
        container_name: workmate-db
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            # 관측 스택(--profile obs)의 Grafana 읽기 전용 롤 비밀번호 — db/init/19-grafana-readonly.sh 가 읽는다.
            # 값이 없으면 그 스크립트가 롤 생성을 건너뛴다(관측 스택을 안 쓰면 정상)
            GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-}
            # 데모 관리자 승격(scripts/bootstrap-demo-data.sh --grant-admin)은 배포 직후
            # 사람이 직접 실행할 때만 켜진다 — 이 compose 는 아무것도 자동으로 승격하지 않는다.
            # README 에 데모 비밀번호가 공개돼 있어, 공개 인스턴스에서 데모 계정은 ROLE_USER 여야 한다
            # (방문자는 채팅·영수증·가이드·회의록까지 체험하고, 관리자 화면에는 못 들어온다)
        volumes:
            - workmate-db-data:/var/lib/postgresql/data
            # 스키마·시드는 더 이상 여기서 만들지 않는다 — WAS 기동 시 Flyway(db/migration)가 적용한다.
            # 이 디렉토리에는 initdb 단계에서만 돌아야 하는 19-grafana-readonly.sh(롤 생성) 하나만 남아 있다.
            # 데모 계정·콘텐츠는 scripts/bootstrap-demo-data.sh 가 WAS 기동 후에 만든다(Flyway 로 테이블이 생긴 뒤라야 한다).
            # 과거 스키마 SQL 은 db/init/legacy/ 에 대조용으로 보관 중이며 마운트되지 않는다.
            - ./db/init:/docker-entrypoint-initdb.d
        # 호스트에 5432 를 열지 않는다 — 같은 도커 네트워크의 was 만 접근한다
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
                ]
            interval: 10s
            timeout: 5s
            retries: 10

    was:
        image: ghcr.io/taekyung96/workmate-was:${IMAGE_TAG:-latest}
        container_name: workmate-was
        restart: unless-stopped
        environment:
            SPRING_PROFILES_ACTIVE: docker
            DB_HOST: db
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            GEMINI_API_KEY: ${GEMINI_API_KEY}
            # 개인정보 AES 암복호화 키 — 없으면 AesCryptoConverter 생성 실패로 기동이 깨진다
            AES_SECRET_KEY: ${AES_SECRET_KEY}
            AES_SECRET_IV: ${AES_SECRET_IV}
        volumes:
            # 영수증 이미지·회의 오디오는 컨테이너 안에 쌓인다 → 볼륨으로 빼지 않으면
            # 컨테이너를 다시 만들 때 전부 사라진다 (app.upload.* 가 /app/uploads 기준)
            - workmate-uploads:/app/uploads
        # 호스트에 8081 을 열지 않는다 — WAS 는 내부망에만 둔다 (ADR-0001)
        depends_on:
            db:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "curl", "-fsS", "http://localhost:8081/api/v1/health"]
            interval: 15s
            timeout: 5s
            retries: 5
            # 스프링 컨텍스트 로딩에 20초 이상 걸린다 — 그 사이 실패는 세지 않는다
            start_period: 90s

    web:
        image: ghcr.io/taekyung96/workmate-web:${IMAGE_TAG:-latest}
        container_name: workmate-web
        restart: unless-stopped
        ports:
            # 루프백에만 바인딩한다 — 외부 노출은 Cloudflare Tunnel 이 담당하므로
            # 공유기·방화벽에 구멍을 뚫지 않는다. 서버에서 curl 로 점검할 때 쓴다
            - "127.0.0.1:8080:8080"
        environment:
            SPRING_PROFILES_ACTIVE: docker
            WAS_BASE_URL: http://was:8081
            # 리버스 프록시(터널) 뒤에서 X-Forwarded-* 를 신뢰한다.
            # 없으면 OAuth 리다이렉트 URI 가 http 로 만들어지고 세션 쿠키의 Secure 판정도 틀어진다
            SERVER_FORWARD_HEADERS_STRATEGY: framework
            # 소셜 로그인(F1-1) — 배포 도메인의 콜백 URL 을 각 제공자 콘솔에 등록해야 동작한다
            NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-not-configured}
            NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-not-configured}
            KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-not-configured}
            KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-not-configured}
            GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-not-configured}
            GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-not-configured}
        depends_on:
            was:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "curl", "-fsS", "http://localhost:8080/"]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 60s

    # ↓ 관측 스택(F-OBS 슬라이스 5) — 'obs' 프로파일에서만 뜬다.
    #   docker compose -f docker-compose.deploy.yml --profile obs up -d
    prometheus:
        profiles: ["obs"]
        image: prom/prometheus:v2.55.1
        container_name: workmate-prometheus
        restart: unless-stopped
        volumes:
            - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
            - workmate-prometheus-data:/prometheus
        command:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.retention.time=15d"
        # 호스트에 포트를 공개하지 않는다 — 같은 도커 네트워크의 Grafana 만 접근 (§3-3)

    grafana:
        profiles: ["obs"]
        image: grafana/grafana:11.4.0
        container_name: workmate-grafana
        restart: unless-stopped
        ports:
            # 루프백에만 바인딩 — 인터넷에 노출하지 않는다(§3-3). 밖에서 봐야 하면
            # 앱과 다른 별도 호스트명 + Access 인증으로 Cloudflare Tunnel 을 따로 붙인다
            - "127.0.0.1:3000:3000"
        environment:
            GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
            # datasources.yml 의 ${POSTGRES_DB}·${GRAFANA_DB_PASSWORD} 치환용 — 없으면 DB 데이터소스가 조용히 깨진다
            POSTGRES_DB: ${POSTGRES_DB}
            GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
        volumes:
            - ./docker/grafana/provisioning:/etc/grafana/provisioning
            - workmate-grafana-data:/var/lib/grafana
        depends_on:
            - prometheus
            - db

    # 외부 노출 — 아웃바운드 연결만 쓰므로 포트포워딩·DDNS·고정IP 가 필요 없다.
    # 터널 토큰을 발급받은 뒤에만 띄운다:
    #   docker compose -f docker-compose.deploy.yml --profile tunnel up -d
    cloudflared:
        profiles: ["tunnel"]
        image: cloudflare/cloudflared:latest
        container_name: workmate-tunnel
        restart: unless-stopped
        command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
        depends_on:
            - web

volumes:
    workmate-db-data:
    workmate-uploads:
    workmate-prometheus-data:
    workmate-grafana-data:
