# =============================================================
# 배포용 compose — 서버는 GHCR 이미지를 "받기만" 한다.
# 소스 빌드가 없으므로 서버에 JDK·Node·Gradle 이 필요 없다.
#
#   git clone https://github.com/taekyung96/workmate.git   # db/init/*.sql 이 필요해서 클론한다
#   cd workmate && cp .env.example .env && vi .env          # 비밀값 채우기
#   docker compose -f docker-compose.deploy.yml up -d
#
# 갱신:  docker compose -f docker-compose.deploy.yml pull && ... up -d
# 롤백:  IMAGE_TAG=sha-<커밋해시> docker compose -f docker-compose.deploy.yml up -d
#
# 개발용은 docker-compose.yml (소스에서 빌드). 이 파일과 프로젝트명이 달라 볼륨도 분리된다.
# =============================================================

# 프로젝트명을 고정한다 — 디렉토리 이름에 따라 컨테이너·볼륨 접두사가 바뀌지 않게
name: workmate

services:
    db:
        image: pgvector/pgvector:pg17
        container_name: workmate-db
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        volumes:
            - workmate-db-data:/var/lib/postgresql/data
            # 스키마·시드는 볼륨을 처음 만들 때만 실행된다 (db/init/*.sql)
            - ./db/init:/docker-entrypoint-initdb.d
        # 호스트에 5432 를 열지 않는다 — 같은 도커 네트워크의 was 만 접근한다
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
                ]
            interval: 10s
            timeout: 5s
            retries: 10

    was:
        image: ghcr.io/taekyung96/workmate-was:${IMAGE_TAG:-latest}
        container_name: workmate-was
        restart: unless-stopped
        environment:
            SPRING_PROFILES_ACTIVE: docker
            DB_HOST: db
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            GEMINI_API_KEY: ${GEMINI_API_KEY}
            # 개인정보 AES 암복호화 키 — 없으면 AesCryptoConverter 생성 실패로 기동이 깨진다
            AES_SECRET_KEY: ${AES_SECRET_KEY}
            AES_SECRET_IV: ${AES_SECRET_IV}
        volumes:
            # 영수증 이미지·회의 오디오는 컨테이너 안에 쌓인다 → 볼륨으로 빼지 않으면
            # 컨테이너를 다시 만들 때 전부 사라진다 (app.upload.* 가 /app/uploads 기준)
            - workmate-uploads:/app/uploads
        # 호스트에 8081 을 열지 않는다 — WAS 는 내부망에만 둔다 (ADR-0001)
        depends_on:
            db:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "curl", "-fsS", "http://localhost:8081/api/v1/health"]
            interval: 15s
            timeout: 5s
            retries: 5
            # 스프링 컨텍스트 로딩에 20초 이상 걸린다 — 그 사이 실패는 세지 않는다
            start_period: 90s

    web:
        image: ghcr.io/taekyung96/workmate-web:${IMAGE_TAG:-latest}
        container_name: workmate-web
        restart: unless-stopped
        ports:
            # 루프백에만 바인딩한다 — 외부 노출은 Cloudflare Tunnel 이 담당하므로
            # 공유기·방화벽에 구멍을 뚫지 않는다. 서버에서 curl 로 점검할 때 쓴다
            - "127.0.0.1:8080:8080"
        environment:
            SPRING_PROFILES_ACTIVE: docker
            WAS_BASE_URL: http://was:8081
            # 리버스 프록시(터널) 뒤에서 X-Forwarded-* 를 신뢰한다.
            # 없으면 OAuth 리다이렉트 URI 가 http 로 만들어지고 세션 쿠키의 Secure 판정도 틀어진다
            SERVER_FORWARD_HEADERS_STRATEGY: framework
            # 소셜 로그인(F1-1) — 배포 도메인의 콜백 URL 을 각 제공자 콘솔에 등록해야 동작한다
            NAVER_CLIENT_ID: ${NAVER_CLIENT_ID}
            NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET}
            KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
            KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
            GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
            GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
        depends_on:
            was:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "curl", "-fsS", "http://localhost:8080/"]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 60s

    # 외부 노출 — 아웃바운드 연결만 쓰므로 포트포워딩·DDNS·고정IP 가 필요 없다.
    # 터널 토큰을 발급받은 뒤에만 띄운다:
    #   docker compose -f docker-compose.deploy.yml --profile tunnel up -d
    cloudflared:
        profiles: ["tunnel"]
        image: cloudflare/cloudflared:latest
        container_name: workmate-tunnel
        restart: unless-stopped
        command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
        depends_on:
            - web

volumes:
    workmate-db-data:
    workmate-uploads:
